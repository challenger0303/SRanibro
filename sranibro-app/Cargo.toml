[package]
name = "sranibro-rs"
version = "0.1.11-beta"
edition = "2021"
description = "SRanibro — local eye and face tracking for supported VR headsets"

[package.metadata.winresource]
ProductName = "SRanibro"
FileDescription = "SRanibro"
OriginalFilename = "SRanibro.exe"
LegalCopyright = "Copyright © 2026 challenger0303"

[features]
default = ["external-eyelid-model"]
external-eyelid-model = ["dep:serde_json", "dep:sha2", "dep:ort"]
psvr2-only = []
xr5-only = []
xr5-research-model = ["xr5-only"]
research-synthetic-eye-lab = ["dep:serde_json", "dep:sha2"]
xr5-model-service-client = ["dep:serde_json", "dep:sha2"]

[[bin]]
name = "synthetic-eye-lab"
path = "research/synthetic-eye-lab/main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "synthetic-eye-atlas"
path = "research/synthetic-eye-lab/atlas_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "synthetic-eye-phase13"
path = "research/synthetic-eye-lab/phase13_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "synthetic-eye-xr5-transfer"
path = "research/synthetic-eye-lab/xr5_transfer_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "xr5-geometry-discovery"
path = "research/synthetic-eye-lab/xr5_geometry_discovery_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "xr5-photometric-replay"
path = "research/synthetic-eye-lab/xr5_photometric_replay_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "xr5-landmark-residual-audit"
path = "research/synthetic-eye-lab/xr5_landmark_residual_audit_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "xr5-residual-counterfactual"
path = "research/synthetic-eye-lab/xr5_residual_counterfactual_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "sranibro-psvr2-probe"
path = "tools/psvr2-probe.rs"

[[bin]]
name = "sranibro-xr5-dataset-collector"
path = "tools/xr5-dataset-collector.rs"
required-features = ["xr5-only"]

[dependencies]
matrixmultiply = "0.3"
bytemuck = "1"
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
toml = "0.8"
hmac = "0.12"
md-5 = "0.10"
jpeg-decoder = "0.3"
jpeg-encoder = "0.6"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = { version = "0.29", features = ["glow", "wgpu"] }
raw-window-handle = "0.6"
rfd = "0.15"
font8x8 = "0.3"
ab_glyph = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = "22"
libloading = "0.8"
libc = "0.2"
rusb = "=0.9.4"
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "load-dynamic", "api-24"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
wgpu = { version = "22", features = ["dx12"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Usb",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Networking_WinHttp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Media_Audio",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
