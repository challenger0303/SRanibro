[package]
name = "sranibro-rs"
version = "0.1.9-beta"
edition = "2021"
description = "SRanibro — local eye and face tracking for supported VR headsets"

[package.metadata.winresource]
ProductName = "SRanibro"
FileDescription = "SRanibro"
OriginalFilename = "SRanibro.exe"
LegalCopyright = "Copyright © 2026 challenger0303"

# matrixmultiply: pure-Rust BLIS-style sgemm with runtime AVX/FMA detection.
# No C/system deps -> distribution-safe, and turns the conv hot path from a
# naive 2.6 GMAC/s loop into a vectorized GEMM. (egui/openvr come in later keystones.)
[features]
default = []
# Separate public beta that can only construct the PSVR2Toolkit adapter.
# It never materializes or resolves a Tobii runtime and uses its own config file.
psvr2-only = []
# Paused Dream Air / XR5 variant. XR5 acquisition, calibration, and research UI
# are intentionally absent from the default Hotmirror build and use isolated state.
xr5-only = []
# Offline research tooling only. The normal application does not build this target or
# activate its JSON / model-fingerprint dependencies.
research-synthetic-eye-lab = ["dep:serde_json", "dep:sha2"]
# Standalone XR5 contributor app only. Enables explicit HTTPS upload and local
# upload receipts; it never enables training or model inference.
xr5-model-service-client = ["dep:serde_json", "dep:sha2"]

[[bin]]
name = "synthetic-eye-lab"
path = "research/synthetic-eye-lab/main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "synthetic-eye-atlas"
path = "research/synthetic-eye-lab/atlas_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "synthetic-eye-phase13"
path = "research/synthetic-eye-lab/phase13_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "synthetic-eye-xr5-transfer"
path = "research/synthetic-eye-lab/xr5_transfer_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "xr5-geometry-discovery"
path = "research/synthetic-eye-lab/xr5_geometry_discovery_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "xr5-photometric-replay"
path = "research/synthetic-eye-lab/xr5_photometric_replay_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "xr5-landmark-residual-audit"
path = "research/synthetic-eye-lab/xr5_landmark_residual_audit_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "xr5-residual-counterfactual"
path = "research/synthetic-eye-lab/xr5_residual_counterfactual_main.rs"
required-features = ["research-synthetic-eye-lab"]

[[bin]]
name = "sranibro-psvr2-probe"
path = "tools/psvr2-probe.rs"

[[bin]]
name = "sranibro-xr5-dataset-collector"
path = "tools/xr5-dataset-collector.rs"
required-features = ["xr5-only"]

[dependencies]
matrixmultiply = "0.3"
bytemuck = "1"
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
toml = "0.8"
# EyeChip auth handshake (HMAC-MD5). Pure-Rust, tiny, runs once at startup.
hmac = "0.12"
md-5 = "0.10"
# Pure-Rust JPEG decoder for the Varjo path: we consume the "Varjo Eye Streamer"
# tool's MJPEG-over-HTTP eye-camera feed (no Varjo SDK FFI needed).
jpeg-decoder = "0.3"
# Pure-Rust grayscale JPEG encoder for the optional loopback-only eye-image
# HTTP/MJPEG output. Encoding runs only while a client is connected.
jpeg-encoder = "0.6"
# Pure-Rust PNG encoder/decoder — used by the eyebrow-calibration capture tab to write
# RAW grayscale eye frames as training data (no opencv / image crate; distribution-safe).
png = "0.17"
# The standalone PSVR2 hardware probe produces one self-contained feedback archive.
zip = { version = "2", default-features = false, features = ["deflate"] }
# In-process egui dashboard (Fluent-dark). Reads pipeline telemetry directly.
# wgpu backend (DX12->DX11->Vulkan->GL fallback) — far more robust than glow/OpenGL on
# other Windows machines (VMs, RDP, weak/generic GPU drivers) where OpenGL 3 is missing.
eframe = { version = "0.29", features = ["wgpu"] }
# eframe exposes its native window through this standard trait.  The Windows
# build uses the HWND only to mark the blank part of our custom title bar as a
# real HTCAPTION region, so DWM owns dragging and DPI-correct cursor anchoring.
raw-window-handle = "0.6"
# Native file/folder picker for the Settings asset paths (point at the user's
# SRanipal weights / patched DLLs). Windows-native dialog; distribution-safe.
rfd = "0.15"
# Tiny built-in bitmap font used to render the optional SteamVR research target.
# No system font, DirectWrite, or extra runtime asset is required.
font8x8 = "0.3"

# WinUSB direct transport to the EyeChip — no libusb, no patched DLL. Windows-only.
[target.'cfg(windows)'.dependencies]
# Force the DX12 backend into wgpu (feature-unifies with eframe's wgpu). Without this
# wgpu on Windows would only get Vulkan/GL — no better than glow. DX12 is present on
# every Windows 10/11 machine, so this is the actual portability win.
wgpu = { version = "22", features = ["dx12"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Usb",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Networking_WinHttp",
    "Win32_System_IO",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Media_Audio",
] }

# Embeds the app icon resource into the exe (build-time, MSVC rc.exe). Host-gated so a
# non-Windows host build doesn't pull it in. Best-effort — see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# opt-level 3 (not "z"): the goal is low *runtime* load, not a small binary.
# Measured: "z" -> 9.0 ms/inference (193 KB), 3 -> 5.95 ms (217 KB). The 24 KB
# size cost buys 1.5x lower CPU on the ML hot path. lto + 1 codegen unit keep
# the GEMM kernel inlined; panic=abort + strip trim the rest.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
